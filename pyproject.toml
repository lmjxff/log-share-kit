[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "log-share-kit"
version = "0.1.0"
description = "Turn local logs into redacted, readable debugging reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["logs", "redaction", "java", "stacktrace", "debugging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Debuggers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/lmjxff/log-share-kit"
Issues = "https://github.com/lmjxff/log-share-kit/issues"

[project.scripts]
logshare = "logshare.cli:main"

[tool.setuptools.packages.find]
include = ["logshare*"]
